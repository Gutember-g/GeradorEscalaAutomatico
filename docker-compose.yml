services:
  postgres:
    image: postgres:15-alpine
    container_name: gerador-escala-postgres
    environment:
      POSTGRES_DB: escala_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
